name: (temp) Compara vendas manuais x trackeamento automático

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Roda comparação
        run: |
          python3 build/_tmp_manual_compare.py < build/_tmp_manual_agosto.json
